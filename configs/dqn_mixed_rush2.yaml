# Mixed training with rush hour over-sampled: the scenario cycle is
# low, rush, tidal, rush, so half of all training episodes are rush hour.
# Last mixed sweep (results/sweeps/mixed_g99): low traffic and tidal fine, rush hour 280-370
# vs ~140 for fixed-time. Hypothesis: rush hour gets too little practice (1/3 of episodes).
# Evaluation scores the unique scenarios; the sweep logs per-scenario waiting.
# Run:
#   traffic-drl sweep --config configs/dqn_mixed_rush2.yaml --out-dir results/sweeps/mixed_rush2
extends: dqn_mixed_g99.yaml
name: intersection_dqn_mixed_rush2

scenarios:
  - scenarios/low_traffic.yaml
  - scenarios/rush_hour.yaml
  - scenarios/tidal.yaml
  - scenarios/rush_hour.yaml

sweep:
  episodes: 160
  eval_episodes: 1
  seeds: [0, 1, 2, 3]
  grid:
    learning_rate: [0.0005]
    target_sync_steps: [100]
    epsilon_decay: [0.96]
    gamma: [0.99]
    reward.switch_penalty: [5]
