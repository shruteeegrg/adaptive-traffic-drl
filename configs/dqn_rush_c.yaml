# Follow-up to results/sweeps/rush_a: gamma 0.99 brought rush-hour waiting from
# 230-300 down to ~150 (fixed-time is ~140), and two of the best runs peaked at the
# LAST episode, so they were still improving. Test a longer horizon (gamma 0.995)
# and longer training (250 episodes), penalty 5 kept.
# Run:
#   traffic-drl sweep --config configs/dqn_rush_c.yaml --scenario configs/scenarios/rush_hour.yaml --out-dir results/sweeps/rush_c
extends: dqn.yaml
name: intersection_dqn_rush_c

sweep:
  episodes: 250
  eval_episodes: 2
  seeds: [0, 1, 2, 3]
  grid:
    learning_rate: [0.0005]
    target_sync_steps: [100]
    epsilon_decay: [0.98]
    gamma: [0.99, 0.995]
    reward.switch_penalty: [5]
