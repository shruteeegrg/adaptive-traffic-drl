# Full-intersection design for the DQN agent (Week 4). Inherits everything
# from intersection.yaml and overrides only the state/reward design and
# network settings -- the Q-table keeps using intersection.yaml's
# queue-only state.
extends: intersection.yaml
name: intersection_dqn

# Training episodes are a fixed amount of *simulated time* (not a fixed
# number of agent decisions): a decision that switches phase takes ~4 s and
# one that doesn't takes 1 s, so a decision-count cap would give
# frequent-switchers more simulated time per episode.
episode_length: 1800

# State = per-approach queue + waiting time, current green phase (one-hot),
# time in phase. 4 + 4 + 2 + 1 = 11 inputs. Scales bring values near [0, 1].
state:
  features: [queue, waiting_time, phase, phase_elapsed]
  queue_scale: 20.0
  wait_scale: 200.0
  phase_elapsed_scale: 60.0

# Reward is charged per simulated second (see traffic_drl/env/features.py):
# cost/s = queue + 0.1 * (vehicles waiting outside to enter the network);
# a decision's reward = -(cost accrued over its seconds, yellow included
# + switch_penalty) / reward_scale. The backlog term matters because the
# short approach edges (~12 vehicles) saturate under heavy demand.
reward:
  queue_weight: 1.0
  wait_weight: 0.0
  backlog_weight: 0.1
  switch_penalty: 5.0
  reward_scale: 50.0

# The agent picks a phase every 5 simulated seconds (a minimum green), not
# every second: per-second decisions let the agent flip constantly.
decision_interval: 5

# DQN settings read by traffic_drl.agent.DQNAgent.from_config (Week 5).
# Learning rate 1e-3 is deliberate: 3e-3 was seen to diverge on the toy
# model for some seeds (see logs/week-05.md) -- revisit in Week 6.
dqn:
  episodes: 100           # training episodes
  max_steps: null         # no decision cap: episodes end at episode_length seconds
  eval_every: 10          # greedy evaluation every N episodes (unseen SUMO seeds); keeps a best checkpoint
  hidden_sizes: [64, 64]
  learning_rate: 0.001
  gamma: 0.95
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.95     # multiplied into epsilon after every episode
  batch_size: 64
  buffer_size: 20000      # replay capacity (transitions)
  learn_start: 500        # transitions buffered before learning begins
  train_every: 1          # gradient step every N env steps
  target_sync_steps: 200  # hard-copy online -> target network every N decisions
  loss: huber             # huber | mse
  seed: 0

# `traffic-drl sweep` trains every combination below x every seed, scores
# each with a greedy evaluation on unseen seeds, and ranks the settings by
# mean_total_waiting (halted + backlogged vehicles). 8 settings x 2 seeds x 80 episodes at ~2 s per episode is
# roughly 1 hour on SUMO; trim the grid or use --episodes/--seeds to shrink.
sweep:
  episodes: 80
  seeds: [0, 1]
  grid:
    learning_rate: [0.0005, 0.001]
    target_sync_steps: [100, 400]
    epsilon_decay: [0.93, 0.96]
