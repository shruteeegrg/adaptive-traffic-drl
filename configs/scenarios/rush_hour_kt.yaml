# Near-capacity even demand (400 veh/h per approach) with a Kathmandu fleet and turns; the Kathmandu counterpart of rush_hour.
# Kathmandu-style vehicle mix (62% motorcycles, 22% cars, 8% buses, 8% light goods) with 15% left and
# 15% right turners per approach. The mix is an ASSUMPTION taken from the project plan (MOPIT 2023);
