# Example client junction spec. Run:  traffic-drl intake --spec configs/examples/junction_example.yaml
# Describes the DEMAND on the project's four-way, one-lane-per-road, two-phase junction.
name: example_morning_peak
description: Morning peak that builds from light to heavy, north-south dominant, motorcycle-heavy traffic.
vehicle_mix: mixed          # cars | mixed | {motorcycle: 0.5, car: 0.3, bus: 0.1, goods: 0.1}
turns: {left: 0.10, right: 0.10}
demand:                     # vehicles per hour on each approach road
  - {minutes: 10, east: 250, north: 450, west: 250, south: 450}
  - {minutes: 10, east: 400, north: 800, west: 400, south: 800}
  - {minutes: 10, east: 300, north: 600, west: 300, south: 600}
