[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-drl"
version = "0.1.0"
description = "Adaptive Traffic Signal Control System using Deep Reinforcement Learning (DQN + SUMO)"
authors = [{ name = "Shruti Gurung" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "pandas",
    "traci",
    "sumolib",
    "pyyaml",
    "streamlit",
]

[project.optional-dependencies]
# The SUMO simulator itself, installable from PyPI (gives the `sumo` program inside the virtual environment).
# Needed for training, `compare` and the live demo; the tests and the saved results do not need it.
sumo = ["eclipse-sumo"]

[project.scripts]
traffic-drl = "traffic_drl.cli:main"

[tool.setuptools.packages.find]
include = ["traffic_drl*"]
